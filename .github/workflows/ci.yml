name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - name: Lint PHP sources and tests
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --coverage-text --coverage-clover coverage.xml --coverage-filter src --fail-on-warning --fail-on-risky
      - name: Publish coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php-${{ matrix.php }}
          path: coverage.xml
          if-no-files-found: error
      - name: Enforce 100% line coverage
        run: |
          php -r '
          $xml = simplexml_load_file("coverage.xml");
          if ($xml === false) {
              fwrite(STDERR, "Unable to read PHPUnit coverage report.\n");
              exit(1);
          }

          $nodes = $xml->xpath("//*[local-name()=\"line\" and @type=\"stmt\"]");
          if ($nodes === false || $nodes === []) {
              fwrite(STDERR, "Unable to locate statement coverage nodes.\n");
              exit(1);
          }

          $total = 0;
          $covered = 0;
          foreach ($nodes as $line) {
              ++$total;
              if ((int) $line["count"] > 0) {
                  ++$covered;
                  continue;
              }
              $files = $line->xpath("ancestor::*[local-name()=\"file\"][1]");
              $file = $files !== false && $files !== [] ? (string) $files[0]["name"] : "unknown";
              fwrite(STDERR, sprintf("Uncovered line: %s:%s\n", $file, (string) $line["num"]));
          }

          if ($covered !== $total) {
              fwrite(STDERR, "Line coverage is {$covered}/{$total}, expected 100%.\n");
              exit(1);
          }

          echo "100% line coverage verified ({$covered}/{$total}).\n";
          '

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer require --dev phpstan/phpstan:^2.1 --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --configuration=phpstan.neon
